# PagesCMS 配置 — pldduck 内容管理
# 文档: https://pagescms.org/docs/configuration/
content:
  # ── 文章集合 ──
  - name: posts
    label: 文章
    type: collection
    path: posts
    format: yaml-frontmatter
    filename: "{fields.id}.md"
    fields:
      - name: id
        label: URL标识（英文字母/数字/下划线/短横线，作为文件名与 /post/ 路径）
        type: string
        required: true
        pattern:
          regex: "^[A-Za-z0-9_-]+$"
          message: URL标识仅支持英文字母、数字、下划线和短横线（中文等字符会使文件名生成失败）
      - { name: title, label: 标题, type: string }
      - { name: excerpt, label: 摘要, type: text }
      - { name: date, label: 发布日期, type: date }
      - { name: updatedAt, label: 更新日期, type: date }
      - { name: tags, label: 标签, type: string, list: true }
      - { name: coverImage, label: 封面图链接, type: string }
      - { name: author, label: 作者, type: string }
      - { name: featured, label: 精选, type: boolean }
      - { name: featured-top, label: 精选置顶权重, type: number }
      - { name: series, label: 系列文章, type: boolean }
      - { name: series-name, label: 系列名, type: string }
      - { name: series-order, label: 系列顺序, type: number }
      - { name: draft, label: 草稿, type: boolean }
      - name: body
        label: 正文
        type: rich-text
        options:
          format: markdown
          switcher: true   # 允许切换源码模式编辑数学公式/Mermaid/嵌套图片链接

  # ── 友链集合：直接读写 friends/ 目录下的 JSON 文件，不改动既有文件结构 ──
  - name: friends
    label: 友链
    type: collection
    path: friends
    format: json
    # 文件名取自独立的 filename 字段（ASCII slug）：站点名称多为中文，按名称
    # 直接 slugify 会得到空串并生成 ".json" 点文件，PagesCMS 保存时报
    # Invalid extension "" for content "friends"（回归测试见 scripts/pagescms-config.test.mjs）
    filename: "{fields.filename}.json"
    view:
      primary: name
    fields:
      - { name: name, label: 站点名称, type: string, required: true }
      - name: filename
        label: 文件名（英文字母/数字/下划线/短横线，例如 my-blog）
        type: string
        required: true
        pattern:
          regex: "^[A-Za-z0-9_-]+$"
          message: 文件名仅支持英文字母、数字、下划线和短横线（不含 .json 后缀）
        options:
          maxlength: 64
      - { name: description, label: 站点简介, type: text, required: true }
      - { name: avatar, label: 头像地址, type: string, required: true }
      - { name: url, label: 站点地址, type: string, required: true }
      - name: unavailable
        label: 已失联
        description: 勾选后该友链归入「已失联的博客」板块。每日失联巡检会按探测结果双向覆写此开关（两次探测都打不开则勾上、恢复访问则取消），手工勾选会在下一轮巡检时被覆盖
        type: boolean

  # ── 友链黑名单（单文件）：命中的站点不会自动收录，也不进人工审核 ──
  - name: friendBlacklist
    label: 友链黑名单
    type: file
    path: config/friend-blacklist.json
    format: json
    fields:
      - name: domains
        label: 黑名单域名（支持泛域名，如 *.spam.com）
        description: 每行一个域名或完整 URL；example.com 会连带屏蔽所有子域，*.example.com 只屏蔽子域（不屏蔽裸域）；大小写不敏感。命中的申请会被直接拦截并关闭，不进入人工审核
        type: string
        list: true

  # ── 评论关键词配置（单文件，CMS 中直接编辑，保存即推送到仓库生效）──
  - name: commentKeywords
    label: 评论关键词
    type: file
    path: config/comment-keywords.json
    format: json
    fields:
      - { name: description, label: 配置说明, type: text, hidden: true }
      - name: action
        label: 评论命中动作
        type: select
        options:
          values: ["minimize", "delete", "none"]
      - name: discussionAction
        label: 新建讨论命中动作
        type: select
        options:
          values: ["delete", "none"]
      - { name: exemptUsers, label: 豁免用户（不审核）, type: string, list: true }
      - { name: keywords, label: 关键词（子串匹配）, type: string, list: true }
      - { name: patterns, label: 正则表达式（忽略大小写）, type: string, list: true }

  # ── 站点配置：按用途拆成两份文件（站点配置 / 评论与留言板），
  #    构建期与运行期各加载器再合并回同一份 siteConfig，消费方无需感知拆分 ──
  - name: siteConfig
    label: 站点配置
    type: file
    path: config/site.config.json
    format: json
    fields:
      - { name: title, label: 站点标题, type: string, required: true }
      - { name: subtitle, label: 站点副标题（英文别名）, type: string, description: 仅用于 JSON-LD 的 alternateName（结构化数据里的品牌别名），不再出现在页面文案中 }
      - { name: seoHomeTitle, label: 首页 SEO 标题, type: string, description: 浏览器标签页与搜索结果里首页显示的完整标题，逐字使用，不参与「页面名 | 站点名」拼接 }
      - { name: seoHomeDescription, label: 首页 SEO 描述, type: text }
      - { name: description, label: 站点描述, type: text, required: true }
      - { name: logo, label: Logo, type: string, description: '站内展示位用图，默认本地底图 /logo.png（对应 public/logo.png，600×600）；用于 JSON-LD publisher/logo 与友链页「本站信息」的 LOGO 复制文本。可填远程 URL，但友链页展示的是绝对地址' }
      - { name: logoSmall, label: 小 Logo, type: string, description: '侧栏与顶栏的站标头像位（渲染尺寸 28px），默认本地 /logo-96.png（对应 public/logo-96.png）' }
      - { name: seoImage, label: 分享图链接, type: string }
      - { name: footerText, label: 页脚版权文字, type: string }
      - { name: url, label: 站点 URL, type: string, required: true }
      - name: statusPageUrl
        label: 服务状态页地址
        description: 'Better Stack 自定义状态页的 HTTPS 地址（如 https://status.pldduck.com），作为侧栏底部「服务状态」入口的跳转目标；构建期可用 VITE_BETTERSTACK_STATUS_PAGE_URL 覆盖。公开配置项，禁止在此填写任何 API Token'
        type: string
      - name: social
        label: 社交链接
        type: object
        fields:
          - { name: github, label: GitHub, type: string }
          - { name: email, label: 邮箱（mailto:）, type: string }
          - { name: rawEmail, label: 邮箱地址, type: string }
          - name: qq
            label: QQ 号
            description: 纯数字文本；首页「联系方式」的 QQ 二维码悬浮层里展示，留空则不展示 QQ 入口
            type: string
          - name: qqQrCode
            label: QQ 二维码图片链接
            description: 首页 QQ 入口鼠标悬停或手机点击时在按钮上方悬浮显示的二维码图片地址（站内路径如 /images/qq-qr.png，或完整 https URL）；与 QQ 号同时配置才展示入口
            type: string
      - name: author
        label: 作者信息
        type: object
        fields:
          - { name: name, label: 昵称, type: string, required: true }
          - { name: avatar, label: 头像, type: string, description: '首页的作者头像，默认本地 /logo-96.png' }
          - { name: role, label: 身份/角色, type: string }
          - { name: bio, label: 简介, type: text }
      - name: toc
        label: 目录设置
        type: object
        fields:
          - { name: collapseInactiveRootBranches, label: 折叠非激活分支, type: boolean }
      - name: friendsPage
        label: 友链页
        type: object
        fields:
          - { name: repoUrl, label: 仓库地址, type: string }
          - { name: repoFriendsUrl, label: 友链目录地址, type: string }
          - { name: applyUrl, label: 友链申请 Issue 地址, type: string }
      - name: content
        label: 文章内容仓库（"在 GitHub 上编辑此文"入口使用）
        type: object
        fields:
          - { name: repoUrl, label: 内容仓库地址, type: string }
          - { name: defaultBranch, label: 默认分支, type: string }

  # ── 评论与留言板（config/comments.config.json）：合并回 siteConfig 的 giscusEnabled / comments / guestbook ──
  - name: commentsConfig
    label: 评论与留言板
    type: file
    path: config/comments.config.json
    format: json
    fields:
      - { name: giscusEnabled, label: 启用 Giscus 评论, type: boolean }
      - name: comments
        label: Giscus 评论配置（改动需与 GitHub 实际值一致，否则评论区失效）
        type: object
        fields:
          - { name: repo, label: 仓库, type: string }
          - { name: repoId, label: 仓库 ID, type: string }
          - { name: category, label: 分类名, type: string }
          - { name: categoryId, label: 分类 ID, type: string }
          - name: origin
            label: giscus 来源地址
            description: 默认 https://giscus.app（官方直连）；自托管/镜像时填完整 URL。大陆网络下官方地址被 DNS 污染可能无法加载
            type: string
          - name: strict
            label: 严格匹配
            description: 关闭（推荐）：按标题匹配并允许自动建讨论；开启：按正文 SHA-1 哈希匹配（历史讨论需含哈希标记）
            type: boolean
      - name: guestbook
        label: 留言板
        type: object
        fields:
          - { name: discussionId, label: Discussion ID, type: number }
      - name: shuoshuo
        label: 说说（Giscus 数据源）
        description: 公告分类下承载「说说」的 Discussion 编号（该讨论里的每条评论 = 一条说说；分类与讨论只能在 GitHub 网页端 Discussions 创建）
        type: object
        fields:
          - { name: discussionId, label: Discussion 编号, type: number }

# ── 部署动作：CMS 侧边栏按钮，触发 .github/workflows/deploy.yml ──
# 文档: https://pagescms.org/docs/configuration/actions/
actions:
  - name: deploy-site
    label: 部署到 Cloudflare Worker
    workflow: deploy.yml
    ref: current
    confirm:
      title: 确认部署？
      message: 将在 GitHub Actions 中构建全站，并直传部署到 Cloudflare Worker（Workers Static Assets）
      button: 开始部署

  # ── 评论关键词全量复查：用当前关键词配置重新审查仓库内全部评论 ──
  - name: recheck-comments
    label: 重新审查全部评论
    workflow: comment-keyword-recheck.yml
    ref: current
    confirm:
      title: 确认重新审查全部评论？
      message: 将遍历仓库内全部评论，使用当前「评论关键词」配置重新匹配并执行处理动作（minimize 折叠 / delete 删除 / none 仅记录）。已放行的评论不会被反向恢复。
      button: 开始审查

  # ── 文章外链失效扫描：扫描 posts/*.md 全部 http/https 外链，失效链接汇总推送 飞书机器人 Webhook ──
  - name: check-broken-links
    label: 检查失效外链
    workflow: check-broken-links.yml
    ref: current
    confirm:
      title: 确认扫描文章外链？
      message: 将逐个请求 posts/ 中全部外链（Markdown 链接 + HTML 链接，排除图片与站内锚点）：发现的失效链接会按文章分组汇总（带行号与 HTTP 状态）推送到 飞书机器人 Webhook，不修改仓库、不触发部署。
      button: 开始扫描

  # ── 友链失联审核：探测 friends/*.json 全部站点，双向同步「已失联」开关并触发一次部署 ──
  - name: friend-availability-audit
    label: 友链失联审核
    workflow: friend-availability-audit.yml
    ref: current
    confirm:
      title: 确认审核友链失联状态？
      message: 将逐个请求 friends/ 中每个友链的站点地址（不可达的等 30 秒复测一次），并按结论**覆写「已失联」开关**（含取消站长手工勾选）：有改动时提交 friends/*.json 并触发一次部署。单轮最多标记 3 个，不可达过半自动熔断只报告。
      button: 开始审核

  # ── 飞书机器人 Webhook 通知测试：验证 FEISHU_WEBHOOK_URL 配置，并向飞书机器人 Webhook 发送测试消息 ──
  - name: test-feishu-webhook
    label: 测试 飞书机器人 Webhook 通知
    workflow: feishu-webhook.yml
    ref: current
    confirm:
      title: 确认发送测试消息？
      message: 将触发 飞书机器人 Webhook 通知 workflow，向已配置的 飞书机器人 Webhook 发送一条测试消息（需先在仓库 Secrets 配置 FEISHU_WEBHOOK_URL）。
      button: 发送测试
