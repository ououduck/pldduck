name: 友链申请
description: 申请把站点收录到 pldduck.com 的友情链接页（机器人静态检测反链，仅作审核参考）
title: "[友链] "
labels:
  - friend-link
assignees:
  - ououduck
body:
  - type: markdown
    attributes:
      value: |
        ## 申请须知

        1. **站点与头像必须海外可直连访问**：机器人跑在境外的 GitHub Actions 上，会先探测你填的
           站点地址和头像地址。连接超时、被防火墙丢弃、CDN 返回 403 都会判定为「无法访问」，
           **直接驳回并关闭本 Issue**。如果你开启了禁海外 / 区域屏蔽，请先关闭。
        2. **反链最好是服务端直出的 `<a>`**：`<a href="https://www.pldduck.com">跑路的duck</a>`。
           Vue/React 用 JS 渲染的友链挂件，静态抓取看不到；机器人会用无头浏览器再渲染一次，
           但加载慢、被墙或被反爬拦住的挂件仍可能被判成「未检测到」。
        3. **反链检测结果只是参考证据**，不会自动上架。站长看完证据后手动打 `friend-approved` 标签才会写入，
           打 `friend-rejected` 则拒绝并关闭本 Issue。
        4. 只认 `<a href>`：图片、RSS、`rel=canonical`、跳转页、评论区里的链接都不算。
        5. 常见挂链位置：首页页脚、友情链接/friends 单独页、关于页。
        6. 请如实填写。名称/简介会公开展示。
        7. **本表单只用于新增收录**：已收录的条目要改名称/地址/简介/头像，或想把友链下架，
           请邮件联系 pldduck@outlook.com，不要重复开 Issue（同一站点地址会被判「已收录」并退回）。

  # 示例占位统一用本站信息（与 config/site.config.json 同步；改站点名/域名/简介/LOGO 时一起改）。
  - type: input
    id: name
    attributes:
      label: 站点名称
      description: 展示在友链卡片上的名字（不超过 50 字）
      placeholder: 跑路的duck
    validations:
      required: true
      maxLength: 50

  - type: input
    id: url
    attributes:
      label: 站点地址
      description: 站点首页完整地址，http/https，不要写 IP、不要带账号信息
      placeholder: https://www.pldduck.com
    validations:
      required: true
      maxLength: 500

  - type: input
    id: backlink-page
    attributes:
      label: 反链页面地址
      description: 实际挂着本站链接的那个页面（必须与站点地址同域）。留空则检测站点首页
      placeholder: https://www.pldduck.com/friends
    validations:
      required: false
      maxLength: 500

  - type: input
    id: avatar
    attributes:
      label: 头像地址
      description: 直接可访问的图片链接（http/https），建议 128×128 以上
      placeholder: https://www.pldduck.com/logo.png
    validations:
      required: true
      maxLength: 500

  - type: textarea
    id: description
    attributes:
      label: 站点简介
      description: 一两句话说清你的站点在写什么（不超过 120 字）
      placeholder: 跑路的duck的小站
    validations:
      required: true
      maxLength: 120

  - type: checkboxes
    id: confirmations
    attributes:
      label: 确认事项
      description: 三项都必须勾选，否则检测会被退回
      options:
        - label: 我已在自己的站点上添加了指向本站的链接
          required: true
        - label: 我的网站没有开启禁海外，能正常访问
          required: true
        - label: 我同意站点名称、简介、头像与地址在 pldduck.com 公开展示
          required: true
