<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>跑路的duck</title>
    <link rel="icon" href="%BASE_URL%favicon.ico" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%pwa-192.png" />
    <!-- 首屏 CSS 预取：入口样式表为内容哈希文件名（构建后才可知），preload 由
         vite.config.ts 的 inject-entry-css-preload 插件在构建时注入产物 index.html，
         与 Vite 注入的样式表（含 crossorigin）保持一致，避免重复下载。 -->
    <!-- 模板级兜底 meta：生产构建时会被 SSG 的 mergeHead 移除（每页以 Seo 组件的
         实际输出为准），仅作为开发模式 / 未跑 SSG 时的后备。文案与 siteConfig 保持一致。 -->
    <meta name="description" content="跑路的duck的小站" />
    <meta name="keywords" content="pldduck,跑路的duck,前端博客,技术分享,编程教程,React,TypeScript,Web开发" />
    <meta name="theme-color" content="#0a0a0a" />
    <!-- color-scheme：全站深色唯一，声明 dark 让 UA 组件（滚动条/表单控件/默认 canvas 色）
         在 CSS 加载前就适配深色，避免首帧闪白。mergeHead 不移除该标签，生产构建安全保留。 -->
    <meta name="color-scheme" content="dark" />

    <!-- 图床域名提前建连：文章封面图（LCP 元素）托管于 img.pldduck.com，
         移动端 4G 下提前完成 DNS→TCP→TLS 可显著缩短首张封面图下载延迟。
         crossorigin 与 SSG 注入的 <link rel=preload as=image> 及 <img> 的跨域
         请求保持一致，确保连接可被复用而非重新握手。 -->
    <link rel="preconnect" href="https://img.pldduck.com" crossorigin />
    <link rel="dns-prefetch" href="https://img.pldduck.com" />
    <!-- Vercount 访问统计 API（events.vercount.one）：提前完成 DNS/TLS，路由级计数请求由应用代码发起。 -->
    <link rel="preconnect" href="https://events.vercount.one" crossorigin />
    <link rel="dns-prefetch" href="https://events.vercount.one" />
    <!-- Clarity 访问分析：提前完成 DNS/TLS，异步脚本可更快加载。 -->
    <link rel="preconnect" href="https://www.clarity.ms" crossorigin />
    <link rel="dns-prefetch" href="https://www.clarity.ms" />

    <!-- 字体：全站只使用系统阅读字体（见 src/index.css 的 --font-sans），不加载
         任何 Web Font。此前为衬线标题引入的 Playfair Display（Google Fonts）
         已随「全站统一文章正文阅读字体」移除：少一次外部样式表请求，首屏不再等
         字体 CSS，也不会出现拉丁衬线 + 中文回退字体混排。 -->

    <!-- Clarity 访问分析：标准异步标签，统计代码与项目 ID 直接写死于此。 -->
    <script type="text/javascript">
      (function (c, l, a, r, i, t, y) {
        c[a] =
          c[a] ||
          function () {
            (c[a].q = c[a].q || []).push(arguments);
          };
        t = l.createElement(r);
        t.async = 1;
        t.src = 'https://www.clarity.ms/tag/' + i;
        y = l.getElementsByTagName(r)[0];
        y.parentNode.insertBefore(t, y);
      })(window, document, 'clarity', 'script', 'yk9n836sio');
    </script>
  </head>

  <body class="bg-void text-ink overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
