# friend-link.yml — 友链 Issue 申请的处理流水线（全部通过自动收录，其余转人工）。
#
# 流程（规则见 ai-rules/friends.md 规则 3/4/5/6/7）：
#   申请人开「友链申请」Issue（.github/ISSUE_TEMPLATE/friend-link-application.yml）
#     → detect job：解析正文 → 验站点/头像在境外能否打开 → 抓反链（静态优先，渲染兜底）
#       · 全部通过（表单合法 + 站点/头像可达 + 反链命中）→ 自动写 friends/<slug>.json
#         → 触发 deploy.yml → 评论「已收录」→ 自动关闭 Issue（2026-11 用户授权，
#         happy path 不再需要人工打标签）
#       · 任一环节没通过 → 只出证据 + 标签 + 飞书「待审核」，Issue 保持开启，等站长人工处理
#   站长人工处理：打「审核通过」→ apply job 复用同一条写入路径并关闭 Issue；
#   决定不收就直接手动关闭 Issue（不再有单独的「拒绝」标签与机器人拒绝评论）。
#
# 为什么自动收录也只走这一条写入路径（机制事实，别改回去）：
#   - GITHUB_TOKEN 的 push **不会触发任何 workflow**，所以机器人写完文件后 CI 不会跑、
#     部署不会跑、飞书 push 通知也不会跑 → 记录校验必须在写入之前完成，
#     部署与通知必须由本脚本自己发起（GITHUB_TOKEN 自 2022-09-08 起可调 workflow_dispatch）。
#   - 自动收录的前提是对方站点真的挂了本站反链且站点可达；但检测只是静态证据，
#     不等于内容可信 —— 站长仍可随时在 Pages CMS 下架（机器人永不删文件）。
#
# 护栏：
#   1) 写入只在「表单校验通过 + 站点/头像可达 + 反链命中」或站长手动打「审核通过」时发生，
#      且 sender.type == 'Bot' 一律跳过；
#   2) 写入目录硬编码 friends/，文件名只从 issue 提交者 login 派生，并在写前断言路径不可穿越；
#   3) 一次只动一个文件（写后核对 commit.files 与回读内容）；
#   4) Contents API 的 sha 乐观锁 + 冲突时只在「同一条记录」前提下重试一次，否则转人工；
#   5) 站长的 unavailable 标记永不被机器人改动；机器人也永不删文件（下架只在 Pages CMS 人工处理）；
#   6) detect job 现在需要写权限（自动收录路径），但只在上述条件成立时才写；apply job 仍是人工入口。
#
# 手动补跑（workflow_dispatch）：填 Issue 编号 + 选 detect（重测）/ apply（人工放行）。
#   两个 job 都把 checkout 钉在 ref: main —— 等价于 deploy.yml 的 ref 守卫：
#   持有写权限的 job 永远不执行别的分支带来的脚本代码。
#   inputs 一律经 env 间接引用，不内插进 run:（ci-cd 规则 10），合法性和 mode 枚举由脚本判定。
#
# 一次性配置（GitHub 侧，零新增 Secret）：
#   建 7 个 label：friend-link / friend-backlink-ok / friend-backlink-missing /
#   friend-needs-info / friend-unreachable / 审核通过 / friend-added；
#   确认 main 分支没有分支保护（有的话机器人写文件会 403，需要改走 PR）。
name: Friend Link Check

on:
  issues:
    # labeled 只用于「审核通过」（人工放行入口）；检测只认 opened/edited/reopened。
    # **不要**把 labeled(friend-link) 加进 detect —— 模板与页面预填都会在创建时
    # 带上该标签，GitHub 会额外发一次 labeled 事件，两个分支同时命中会让一次申请
    # 跑两遍检测、发两条重复评论（2026-11 修复）。
    types: [opened, edited, reopened, labeled]
  issue_comment:
    # 申请人补一句「我改好了」即可重测（脚本里限定：作者本人或 OWNER/MEMBER/COLLABORATOR，
    # 且正文不含机器人标记）。
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue 编号'
        required: true
        type: string
      mode:
        description: '执行动作'
        required: true
        type: choice
        default: detect
        options:
          - detect
          - apply

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  detect:
    # 自动收录需要写仓库文件（全部通过时）；没通过的路径只出证据、不写。
    if: >-
      github.event.sender.type != 'Bot' && (
        (github.event_name == 'issues' && (github.event.action == 'opened' || github.event.action == 'edited' || github.event.action == 'reopened')) ||
        (github.event_name == 'issue_comment' && github.event.action == 'created' && contains(github.event.issue.labels.*.name, 'friend-link')) ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'detect')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      actions: write
    concurrency:
      # 同一个 Issue 的多次编辑/评论串行，避免两条检测评论互相插队；不同 Issue 并行。
      group: friend-link-detect-${{ github.event.issue.number || github.event.inputs.issue }}
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        # undici（lib/http.mjs 的 SSRF dispatcher）是生产依赖，需要安装。
        run: npm ci --no-audit --no-fund

      - name: Cache Playwright browsers
        # 渲染兜底用的 Chromium 体积大，按 lockfile 指纹缓存；命中时安装步骤只补系统依赖。
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install headless Chromium
        # 只在「静态抓取没命中」时才会真正启动浏览器；安装失败时脚本会自动退回静态结论。
        run: npx playwright install --with-deps chromium

      - name: Run backlink detection
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FRIEND_MODE: ${{ github.event.inputs.mode }}
          FRIEND_ISSUE: ${{ github.event.inputs.issue }}
        run: node scripts/friend-link-check.mjs

  apply:
    # 人工放行入口：只有「审核通过」标签或手动 dispatch 的 apply 才会进来。
    if: >-
      github.event.sender.type != 'Bot' && (
        (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == '审核通过') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'apply')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      # 全局串行：两条 Issue 同时放行会争抢 friends/ 目录与同一个 deploy.yml。
      group: friend-link-apply
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply owner decision
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FRIEND_MODE: ${{ github.event.inputs.mode }}
          FRIEND_ISSUE: ${{ github.event.inputs.issue }}
        run: node scripts/friend-link-check.mjs
